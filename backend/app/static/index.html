<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Examination Pattern Analysis</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">DBMS Project</p>
          <h1>Historical Examination Pattern Analysis</h1>
        </div>
        <nav class="dashboard-tabs" aria-label="Dashboard sections">
          <button class="tab-button active" data-tab="overview" type="button">Overview</button>
          <button class="tab-button" data-tab="search" type="button">Question Search</button>
          <button class="tab-button" data-tab="similarity" type="button">Semantic Similarity</button>
          <button class="tab-button" data-tab="paper" type="button">Paper Ingestion</button>
        </nav>
      </header>

      <main class="layout">
        <aside class="panel filters-panel">
          <h2>Filters</h2>
          <label>
            Search questions
            <input id="searchInput" type="text" placeholder="Type topic or keyword..." />
          </label>

          <label>
            Subject
            <select id="subjectFilter">
              <option value="">All subjects</option>
            </select>
          </label>

          <label>
            Semester
            <select id="semesterFilter">
              <option value="">All semesters</option>
            </select>
          </label>

          <label>
            Exam type
            <select id="examTypeFilter">
              <option value="">All exam types</option>
              <option value="Internal">Internal</option>
              <option value="Mid">Mid</option>
              <option value="End">End</option>
              <option value="Supplementary">Supplementary</option>
            </select>
          </label>

          <button id="applyFilters">Apply filters</button>
        </aside>

        <section class="content">
          <section id="overview-panel" class="tab-panel active">
            <div class="stats-grid" id="statsGrid"></div>

            <div class="analytics-grid">
              <div class="panel">
                <h2>Question types</h2>
                <div id="questionTypesChart" class="chart-list"></div>
              </div>

              <div class="panel">
                <h2>Topic frequency</h2>
                <div id="topicsChart" class="chart-list"></div>
              </div>

              <div class="panel span-2">
                <h2>Semester comparison</h2>
                <div id="semesterComparison" class="table-wrapper"></div>
              </div>
            </div>
          </section>

          <section id="search-panel" class="tab-panel">
            <div class="panel">
              <div class="section-header">
                <h2>Question search</h2>
              </div>
              <div id="questionsList" class="questions-list"></div>
            </div>
          </section>

          <section id="similarity-panel" class="tab-panel">
            <div class="panel">
              <div class="section-header">
                <h2>Semantic similar questions</h2>
              </div>
              <div class="semantic-search-row">
                <input id="semanticQueryInput" type="text" placeholder="Try: Explain database normalization" />
                <button id="semanticSearchBtn" type="button">Find similar</button>
              </div>
              <div id="similarQuestionsList" class="questions-list compact"></div>
            </div>
          </section>

          <section id="paper-panel" class="tab-panel">
            <div class="panel paper-form-panel">
              <div class="section-header">
                <h2>Paper ingestion</h2>
              </div>

              <div class="paper-form-grid">
                <label>
                  Subject
                  <select id="paperSubject">
                    <option value="">Choose subject</option>
                  </select>
                </label>

                <label>
                  Semester
                  <select id="paperSemester">
                    <option value="">Choose semester</option>
                  </select>
                </label>

                <label>
                  Exam type
                  <select id="paperExamType">
                    <option value="Internal">Internal</option>
                    <option value="Mid">Mid</option>
                    <option value="End" selected>End</option>
                    <option value="Supplementary">Supplementary</option>
                  </select>
                </label>

                <label>
                  Total marks
                  <input id="paperTotalMarks" type="number" min="1" placeholder="Enter total marks" />
                </label>
              </div>

              <div class="paper-questions-block">
                <div class="section-header compact-header">
                  <h3>Questions</h3>
                  <button id="addQuestionBtn" class="secondary-btn" type="button">Add question</button>
                </div>
                <div id="paperQuestionRows" class="paper-question-rows"></div>
              </div>

              <div class="paper-form-actions">
                <button id="submitPaperBtn" type="button">Create paper</button>
              </div>

              <div id="paperStatus" class="status-message"></div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
